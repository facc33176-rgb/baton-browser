<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交棒 · Baton</title><link rel="stylesheet" href="/style.css"></head><body><main><header><small>交棒 Baton</small><h1>需要你时，交给你。</h1><p>在浏览器里完成登录，再把控制权交回助手。</p></header><section id="auth"><label for="token">连接口令</label><input id="token" type="password" autocomplete="off" placeholder="服务启动时设置的 BATON_TOKEN"><button id="connect">连接浏览器</button></section><section id="pages" hidden><div class="row"><h2>打开的网页</h2><button id="refresh">刷新</button></div><p>整个浏览器共享一个登录资料目录。接管期间助手暂停操作。</p><div id="list"></div></section><section id="control" hidden><div class="row"><h2>现在由你操作</h2><button id="end">交回助手</button></div><p id="countdown"></p><div class="row"><button id="zoom">放大画面</button><button id="pan">切换移动画面</button></div><div id="desktop"></div><div class="row"><button data-key="65289">Tab</button><button data-key="65293">回车</button><button data-key="65288">退格</button><button data-key="65307">Esc</button></div><form id="text-form"><label for="text">先点网页输入框，再输入文字</label><input id="text" type="password" autocomplete="off" maxlength="500"><button>输入到网页</button></form></section><p id="status" role="status" aria-live="polite"></p><footer>登录资料保存在服务所在设备。交回不会退出账号。五分钟后接管自动结束。</footer></main><script type="module" src="/dist/app.js"></script></body></html>
